name: ronda-e2e
on:
  workflow_run:
    workflows: [verificacion-052]
    types: [completed]
permissions: {}
jobs:
  ronda:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/ronda-reutilizable.yml
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
      base: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
