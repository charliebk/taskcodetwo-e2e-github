# Llamador E2E de TASK-042 (F5-2): un solo llamador por repo.
name: verificacion
on:
  pull_request:
permissions: {}
jobs:
  verificacion:
    permissions:
      contents: read
      checks: write
      actions: read
    uses: charliebk/TaskCodeTwo/.github/workflows/verificacion.yml@c3e803c9b321192d9a532f0e23489648cf01c6b7
    with:
      comando: sh scripts/verificar.sh
      perfiles: completa pesada
      huella-local: uname -sr
