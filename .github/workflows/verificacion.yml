# Llamador E2E de TASK-042 (F5-2): un solo llamador por repo.
name: verificacion
on:
  pull_request:
permissions: {}
jobs:
  verificacion:
    permissions:
      contents: read
      checks: write
      actions: read
    uses: charliebk/TaskCodeTwo/.github/workflows/verificacion.yml@88e7a1cc19aeadfaeae1b6f6566c770d050d45f7
    with:
      comando: sh scripts/verificar.sh
      perfiles: completa pesada
      huella-local: uname -sr
